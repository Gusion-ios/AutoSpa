spring.application.name=autospa-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autospa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:autospa_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
autospa.jwt.secret=${AUTOSPA_JWT_SECRET:}
autospa.gateway.secret=${AUTOSPA_GATEWAY_SECRET:}
autospa.superadmin.email=${AUTOSPA_SUPERADMIN_EMAIL:}
autospa.superadmin.password=${AUTOSPA_SUPERADMIN_PASSWORD:}
autospa.superadmin.name=${AUTOSPA_SUPERADMIN_NAME:Administrador Supremo}
autospa.cors.allowed-origins=${AUTOSPA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://192.168.1.84:5173}
